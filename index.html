<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynamic Dan Fullstack Demo</title>
  <link rel="stylesheet" href="/dynamic-dan.css" />
</head>
<body>
  <main class="demo-page">
    <section>
      <p class="eyebrow">Dynamic EcoHome</p>
      <h1>Dynamic Dan Website Chat</h1>
      <p>This is the combined frontend and backend version. One Node server runs the API and serves this visual chat widget.</p>
      <div class="demo-card">
        <strong>Try asking:</strong>
        <button data-question="Do you offer roofing?">Do you offer roofing?</button>
        <button data-question="How much does solar cost?">How much does solar cost?</button>
        <button data-question="How can I contact support?">How can I contact support?</button>
      </div>
    </section>
  </main>
  <script src="/dynamic-dan.js"></script>
</body>
</html>
